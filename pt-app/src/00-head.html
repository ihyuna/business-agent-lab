<title>PT 기록 앱 MVP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 위에 얇은 도구 줄, 그 아래 아이패드 9세대(1080×810pt) 화면 하나를 창에 맞춰 줄여 보여 준다 */
:root{
  --bg:#e9ecef; --device:#fbfbfa; --panel:#ffffff; --ink:#1d232a; --muted:#5d6874; --faint:#8b949e;
  --line:#d9dee3; --soft:#f1f3f5; --accent:#1f6f8b; --accent-soft:#e3f0f4; --accent-ink:#ffffff;
  --good:#2f7d4f; --good-soft:#e5f3ea; --warn:#9a6a00; --warn-soft:#fbf1d9; --bad:#b03a2e; --bad-soft:#f8e4e1;
  --cond:#c2410c; --cond-soft:#fff0e3; --live:#6741d9; --live-soft:#f0ebff;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14181c; --device:#1b2026; --panel:#222830; --ink:#e7ebef; --muted:#a7b1bb; --faint:#7d8892;
  --line:#353d46; --soft:#2a3139; --accent:#5fb3cf; --accent-soft:#1f3640; --accent-ink:#0d1a1f;
  --good:#6cc28f; --good-soft:#1d3327; --warn:#e0b44e; --warn-soft:#3a3020; --bad:#ec8a7e; --bad-soft:#3d2421; --cond:#ff9a52; --cond-soft:#3d2817; --live:#b39dff; --live-soft:#2c2547; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14181c; --device:#1b2026; --panel:#222830; --ink:#e7ebef; --muted:#a7b1bb; --faint:#7d8892;
  --line:#353d46; --soft:#2a3139; --accent:#5fb3cf; --accent-soft:#1f3640; --accent-ink:#0d1a1f;
  --good:#6cc28f; --good-soft:#1d3327; --warn:#e0b44e; --warn-soft:#3a3020; --bad:#ec8a7e; --bad-soft:#3d2421; --cond:#ff9a52; --cond-soft:#3d2817; --live:#b39dff; --live-soft:#2c2547; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;word-break:keep-all;overflow-wrap:break-word}
#shell{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box;gap:8px}
#bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:13px;color:var(--muted)}
#bar b{color:var(--ink);font-weight:600}
#bar .sp{flex:1}
#main{flex:1;min-height:0;display:flex;gap:12px}
#stage{flex:1;min-width:0;min-height:0;position:relative;overflow:hidden}
#guide{display:none;width:320px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;padding:12px 14px;box-sizing:border-box;line-height:1.5}
#guide.open{display:block}
@media (max-width:860px){#main{flex-direction:column}#guide{width:auto;max-height:44vh;order:2}}
.g-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.g-scenes{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.g-scenes .chip{min-width:30px;justify-content:center}
.g-title{font-weight:600;font-size:15px}
.g-steps{padding-left:20px;margin:8px 0 10px;font-size:13.5px}
.g-steps li{margin-bottom:6px;color:var(--faint)}
.g-steps li.done{color:var(--muted)}
.g-steps li.done::marker{content:'✓ ';color:var(--good)}
.g-steps li.cur{color:var(--ink);font-weight:500;background:var(--warn-soft);border-radius:6px;padding:4px 6px}
.g-done{background:var(--good-soft);color:var(--good);border-radius:8px;padding:8px 10px;font-weight:500}
.g-box{background:var(--soft);border-radius:8px;padding:7px 9px;margin-top:8px;font-size:13px}
.g-box.why{background:var(--accent-soft)}
.g-box.goal{background:var(--good-soft)}
.g-why{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
.g-steps li.cur .g-why{color:var(--ink)}
.g-box b{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.g-foot{margin-top:12px;font-size:12px;color:var(--faint)}
#stage.actual{overflow:auto}
#frame{position:absolute;left:50%;top:0;transform-origin:top left}
#device{width:1080px;height:810px;background:var(--device);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative;box-shadow:0 6px 30px rgba(0,0,0,.12);font-size:15px;line-height:1.45}
#device.port{width:810px;height:1080px}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-sizing:border-box}
textarea{width:100%;min-height:70px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);min-height:56px;box-sizing:border-box}
.top h1{font-size:18px;margin:0;font-weight:600;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px}
.top .grow{flex:1;min-width:0}
.scroll{flex:1;overflow:auto;padding:14px 16px 24px;box-sizing:border-box}
.sp{flex:1}
.actbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel);min-height:62px;box-sizing:border-box}
.actbar .btn.primary{padding:10px 24px;font-size:16px;border-radius:10px}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--panel)}
.tabbar button{flex:1;border:0;background:none;padding:10px 0 13px;font-size:15px;color:var(--muted)}
.tabbar button.on{color:var(--accent);font-weight:600;box-shadow:inset 0 3px 0 var(--accent)}
.srow{padding:12px 6px}
.btn.more{font-size:18px;line-height:1;padding:4px 10px}
.setchip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.setchip .k{font-size:11px;color:var(--muted);margin-right:5px}
.setchip.sel{border-color:var(--accent);background:var(--accent-soft)}
.setchip.ro{cursor:default}
.plan-ex{border-bottom:1px solid var(--line);padding:8px 0}
.plan-ex:last-child{border-bottom:0}
.plan-ex.off{display:flex;align-items:center;gap:8px;opacity:.65}
.pe-row{display:grid;grid-template-columns:24px 180px 120px minmax(0,1fr) 40px;gap:8px;align-items:center}
.pe-n{color:var(--faint);font-variant-numeric:tabular-nums;width:24px}
.pe-sets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.editor{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0 4px}
.show-ex{display:grid;grid-template-columns:minmax(0,1fr) auto 48px;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}
.show-ex:last-child{border-bottom:0} .show-ex .num{font-size:18px;font-weight:700}
.show-pr{background:var(--good-soft);color:var(--good);border-radius:8px;padding:6px 10px;margin-top:4px;font-size:14px}
.numwrap{display:inline-flex;align-items:baseline;gap:3px}
.numin{width:64px;border:0;border-bottom:1px dashed var(--faint);background:transparent;font:inherit;font-size:17px;font-variant-numeric:tabular-nums;padding:3px 4px;border-radius:6px 6px 0 0;color:var(--ink)}
.numin.plan{color:var(--muted)}
.numin:focus{outline:2px solid var(--accent);background:var(--panel);color:var(--ink)}
.numin.a-cond{border-bottom:2px solid var(--cond);background:var(--cond-soft)} .numin.a-live{border-bottom:2px solid var(--live);background:var(--live-soft)}
.numwrap .unit{font-size:12px;color:var(--muted)}
.setmore{margin-left:4px;padding:4px 8px}
.chipedit{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 6px;flex-wrap:wrap}
.chipedit .ci{width:54px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;font-size:14px;background:var(--panel);color:var(--ink)}
.card.fold{padding-top:8px;padding-bottom:8px}
.foldhead{display:flex;align-items:center;width:100%;border:0;background:none;padding:2px 0;cursor:pointer;text-align:left;color:inherit;font:inherit}
.foldhead h2{flex:1;margin:0}
.foldhead .cnt{display:inline-block;min-width:18px;text-align:center;font-size:12px;border-radius:999px;background:var(--soft);color:var(--muted);padding:0 6px;margin-left:4px}
.card.fold>.foldhead+*{margin-top:8px}
.numbtn{border:0;background:none;padding:3px 6px;border-radius:6px;font-size:17px;font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--faint)}
.numbtn.plan{color:var(--muted)}
.numbtn:hover{background:var(--soft)}
.next{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 14px;border:1px dashed var(--line);border-radius:12px;cursor:pointer;background:var(--panel)}
.next.ready{border-style:solid;border-color:var(--accent)}
.card.ask{border-color:var(--warn);background:var(--warn-soft)}
.hl{outline:3px solid var(--warn)!important;outline-offset:2px;animation:hlp 1.6s ease-in-out infinite;border-radius:6px}
@keyframes hlp{50%{outline-color:transparent}}
g.hl circle:last-of-type{stroke:var(--warn);stroke-width:4}
tr.click{cursor:pointer} tr.click:hover{background:var(--soft)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.small{padding:3px 8px;font-size:13px;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card h2{font-size:15px;margin:0 0 8px;font-weight:600;display:flex;align-items:center;gap:8px}
.card h2 .n{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--soft);color:var(--muted);font-size:12px;align-items:center;justify-content:center}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--panel);font-size:13px;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-flex;align-items:center;border-radius:6px;padding:1px 7px;font-size:12px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.t-목표{background:var(--good-soft);color:var(--good)}
.tag.t-규칙,.tag.t-무게{background:var(--warn-soft);color:var(--warn)}
.tag.t-고침{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.good{background:var(--good-soft);color:var(--good)}
.ex-ex{font-size:12px;color:var(--warn)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li.click{cursor:pointer} .li.click:hover{background:var(--soft)}
.empty{color:var(--faint);font-size:13px;padding:6px 0}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-weight:500}
.note-box{background:var(--soft);border-radius:8px;padding:6px 10px;font-size:13px}
.step{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-width:30px;height:30px;padding:0 6px}
.val{width:70px;text-align:center;padding-inline:4px}
.set-row{display:grid;grid-template-columns:64px 130px 130px minmax(0,1fr) 140px;gap:8px;align-items:center;padding:7px 6px;border-bottom:1px solid var(--line);border-radius:6px}
.set-row.done{background:var(--good-soft)}
.set-row.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.set-row .kind{border:1px solid var(--line);background:var(--panel);border-radius:8px;height:32px;font-size:13px}
.side{width:250px;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
.side .li{padding:10px 12px}
.side .li.cur{background:var(--accent-soft)}
.st-done{color:var(--good)} .st-removed{color:var(--faint);text-decoration:line-through} .st-swapped{color:var(--faint);text-decoration:line-through}
.overlay{position:absolute;inset:0;background:rgba(10,15,20,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{background:var(--panel);border-radius:14px;padding:16px 18px;width:560px;max-height:86%;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 10px;font-size:17px}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--device);padding:8px 14px;border-radius:10px;z-index:30;font-size:14px}
.timer{background:var(--accent-soft);color:var(--accent);padding:6px 16px;display:flex;gap:10px;align-items:center;font-weight:600}
.field{display:flex;flex-direction:column;gap:4px} .field label{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.chart text{fill:var(--muted);font-size:11px}
.dimline{color:var(--faint);font-size:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:10px 0}
mark{background:var(--warn-soft);color:var(--ink);border-radius:3px;padding:0 1px}
#device.port .side{width:190px}
#device.port .set-row{grid-template-columns:52px 110px 112px minmax(0,1fr) 128px;gap:6px}
#device.port .pe-row{grid-template-columns:22px 150px 110px minmax(0,1fr) 36px}
#device.port .val{width:58px}
#device.port .grid3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
/* v3: 컨디션으로 바뀐 숫자는 주황(cond), 수업 중 결과로 바뀐 숫자는 보라(live) */
.a-cond{color:var(--cond)!important;font-weight:700} .a-live{color:var(--live)!important;font-weight:700}
.setchip.a-cond{border-color:var(--cond);background:var(--cond-soft)} .setchip.a-live{border-color:var(--live);background:var(--live-soft)}
.numbtn.a-cond{border-bottom:2px solid var(--cond);background:var(--cond-soft)} .numbtn.a-live{border-bottom:2px solid var(--live);background:var(--live-soft)}
.tag.t-cond{background:var(--cond-soft);color:var(--cond);border:1px solid var(--cond)} .tag.t-live{background:var(--live-soft);color:var(--live);border:1px solid var(--live)}
.adjbtn{cursor:pointer;font-weight:600}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.timebar{display:flex;align-items:center;gap:14px;padding:6px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.timebar b{font-size:16px}
.timebar.tight{background:var(--bad-soft);color:var(--bad)}
.askbar{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--accent);border-radius:12px;padding:10px 14px;z-index:25;box-shadow:0 6px 24px rgba(0,0,0,.18);display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:92%}
.strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.strip .card{padding:10px 12px}
.strip h2{font-size:13px;color:var(--muted);margin-bottom:4px}
.prep-row{display:grid;grid-template-columns:22px 128px 150px 74px minmax(0,1fr) 36px;gap:8px;align-items:center}
.prep-head{font-size:12px;color:var(--muted);padding:6px 0;border-bottom:1px solid var(--line)}
.lastbtn{text-align:left;white-space:normal;color:var(--ink);line-height:1.35}
.judge{display:inline-block;text-align:center;border-radius:999px;padding:3px 8px;font-size:12.5px;font-weight:600;white-space:nowrap}
.j-up{background:var(--good-soft);color:var(--good)} .j-down{background:var(--cond-soft);color:var(--cond)} .j-keep{background:var(--soft);color:var(--muted)} .j-new,.j-find{background:var(--warn-soft);color:var(--warn)}
.pe-why{margin:4px 0 0 30px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font:inherit;font-size:12.5px;cursor:pointer;padding:0}
.brief{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin-bottom:8px}
.prep-hist{margin:6px 0 2px 32px;background:var(--soft);border-radius:8px;padding:6px 10px;font-size:13px}
.draft-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.draft-row:last-child{border-bottom:0}
#device.port .prep-row{grid-template-columns:20px 110px 120px 66px minmax(0,1fr) 32px}
#device.port .strip{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

/* ===== 클리닉 EMR 테마 v2 (2026-11-03, 닥터팔레트 차트·플래너 화면 참고: 흰 바탕, 얇은 회색 선, 왼쪽 메뉴, 파스텔 꼬리표, 시간표 블록) ===== */
:root{
  --bg:#e9ecf1; --device:#ffffff; --panel:#ffffff; --ink:#1f2329; --muted:#6b7380; --faint:#9aa1ab;
  --line:#e6e8ec; --soft:#f6f7f9; --hd:#f6f7f9; --accent:#2f7cf6; --accent-soft:#eaf2ff; --accent-ink:#ffffff;
  --side:#f7f8fa; --zebra:#fafbfc; --bar:#9bbdf7; --now:#f0434b;
  --good:#1e9a5a; --good-soft:#e6f6ec; --warn:#c27a00; --warn-soft:#fff3dc; --bad:#e5484d; --bad-soft:#ffebec;
  --p1:#2f7cf6; --p1s:#e9f1ff; --p2:#9b51e0; --p2s:#f4ecfd; --p3:#e5486f; --p3s:#ffeaf0; --p4:#1e9a5a; --p4s:#e6f6ec; --p5:#d97706; --p5s:#fff3e0; --p6:#0e8a9a; --p6s:#e4f6f8;
  --font:"Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1116; --device:#16191f; --panel:#16191f; --ink:#e6e9ee; --muted:#a0a8b4; --faint:#747c88;
  --line:#2a2f37; --soft:#1e2229; --hd:#1e2229; --accent:#5b9bff; --accent-soft:#1a2a45; --accent-ink:#081324;
  --side:#121519; --zebra:#1a1d23; --bar:#4e78b8; --now:#ff6b70;
  --good:#4cc787; --good-soft:#15291e; --warn:#f0b04a; --warn-soft:#33270f; --bad:#ff7d80; --bad-soft:#3a1d1f;
  --p1:#7fb0ff; --p1s:#1b2b47; --p2:#c39af2; --p2s:#2c2140; --p3:#ff8fab; --p3s:#3d1f29; --p4:#5fd197; --p4s:#15291e; --p5:#f5b24f; --p5s:#352710; --p6:#5cd0de; --p6s:#132e33}}
:root[data-theme="dark"]{
  --bg:#0e1116; --device:#16191f; --panel:#16191f; --ink:#e6e9ee; --muted:#a0a8b4; --faint:#747c88;
  --line:#2a2f37; --soft:#1e2229; --hd:#1e2229; --accent:#5b9bff; --accent-soft:#1a2a45; --accent-ink:#081324;
  --side:#121519; --zebra:#1a1d23; --bar:#4e78b8; --now:#ff6b70;
  --good:#4cc787; --good-soft:#15291e; --warn:#f0b04a; --warn-soft:#33270f; --bad:#ff7d80; --bad-soft:#3a1d1f;
  --p1:#7fb0ff; --p1s:#1b2b47; --p2:#c39af2; --p2s:#2c2140; --p3:#ff8fab; --p3s:#3d1f29; --p4:#5fd197; --p4s:#15291e; --p5:#f5b24f; --p5s:#352710; --p6:#5cd0de; --p6s:#132e33}
#device{font-size:13.5px;border-radius:14px}
.top{background:var(--panel);border-bottom:1px solid var(--line);min-height:50px;padding:8px 14px}
.top h1{font-size:16px;font-weight:700;letter-spacing:-.01em}

.scroll{padding:12px 14px 20px}
.btn{border-radius:6px;padding:5px 11px;border-color:#dfe2e7;font-size:13px}

.card{border-radius:8px;padding:10px 12px;box-shadow:none}

.chip{border-radius:6px;font-size:12px}
.chip.on{background:var(--accent);border-color:var(--accent)}
.tag{border-radius:4px;font-weight:600;font-size:11px;padding:1px 6px}
th{background:var(--hd);color:var(--muted);font-size:11.5px;font-weight:600;white-space:nowrap}
td{font-size:12.5px}
table tr:nth-child(even) td{background:var(--zebra)}
tr.click:hover td{background:var(--accent-soft)}
.li{padding:8px 4px}
.li.click:hover{background:var(--soft)}
.setchip{border-radius:6px}
input,select,textarea{border-radius:6px;border-color:#dfe2e7}
.strip h2{font-size:12px}
/* 왼쪽 메뉴 */

.tabbar.sidenav{position:absolute;left:0;top:0;bottom:0;width:84px;flex-direction:column;align-items:stretch;border-top:0;border-right:1px solid var(--line);background:var(--side);padding:10px 8px;gap:2px;box-sizing:border-box}
.sidenav .logo{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--accent);color:var(--accent);font-weight:800;font-size:13px;margin:2px auto 12px}
.tabbar.sidenav button{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:8px;font-size:11.5px;color:var(--muted);box-shadow:none}
.tabbar.sidenav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabbar.sidenav button:hover{background:var(--soft)}
.tabbar.sidenav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:none}
.sidenav .sp{flex:1}
/* 파스텔 꼬리표 */
.pill{display:inline-flex;align-items:center;border-radius:4px;padding:1px 6px;font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.5}
.c1{color:var(--p1);background:var(--p1s)} .c2{color:var(--p2);background:var(--p2s)} .c3{color:var(--p3);background:var(--p3s)} .c4{color:var(--p4);background:var(--p4s)} .c5{color:var(--p5);background:var(--p5s)} .c6{color:var(--p6);background:var(--p6s)}
.pill.red{color:var(--bad);background:var(--bad-soft)} .pill.gray{color:var(--muted);background:var(--soft)} .pill.blue{color:var(--accent);background:var(--accent-soft)} .pill.green{color:var(--good);background:var(--good-soft)} .pill.orange{color:var(--warn);background:var(--warn-soft)}
/* 오늘 = 플래너 */
.planner{display:grid;grid-template-columns:212px minmax(0,1fr) 236px;height:100%;min-height:0}
.planner>div{min-height:0;overflow:auto}
.pl-left{border-right:1px solid var(--line);padding:12px}
.pl-right{border-left:1px solid var(--line);padding:12px 12px 16px}
.pl-mid{display:flex;flex-direction:column}
.pl-colhd{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px;position:sticky;top:0;background:var(--panel);z-index:2}
.pl-colhd .n{color:var(--faint);font-weight:500}
.mcal{font-size:11.5px;text-align:center;font-variant-numeric:tabular-nums}
.mcal .hd{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:12.5px;margin-bottom:6px}
.mcal table{table-layout:fixed} .mcal td,.mcal th{padding:2px 0;border:0;background:none!important;text-align:center}
.mcal th{color:var(--faint);font-weight:500;font-size:11px}
.mcal button{border:0;background:none;width:26px;height:26px;border-radius:50%;font-size:11.5px;position:relative;padding:0}
.mcal button.other{color:var(--faint);opacity:.55}
.mcal button.sun{color:var(--bad)}
.mcal button.has::after{content:'';position:absolute;left:50%;bottom:2px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.mcal button.today{background:var(--accent);color:#fff;font-weight:700}
.mcal button.today::after{background:#fff}
.mcal button:hover:not(.today){background:var(--soft)}
.pl-sec{margin-top:14px;font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.legend2{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:12.5px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tl{position:relative;flex:none}
.tl .hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tl .hr span{position:absolute;left:10px;top:4px;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.tl .blk{position:absolute;left:64px;right:14px;border-radius:6px;padding:7px 10px;box-sizing:border-box;border-left:3px solid currentColor;overflow:hidden;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tl .blk:hover{filter:brightness(.98);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.tl .blk .bt{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.tl .blk .bn{color:var(--ink);font-size:14px;font-weight:700}
.tl .blk .bs{color:var(--ink);font-weight:500}
.tl .blk .bd{color:var(--muted);font-size:12px;margin-top:2px}
.tl .blk .more{margin-left:auto;color:var(--muted)}
.tl .now{position:absolute;left:52px;right:0;border-top:1.5px solid var(--now);z-index:1}
.tl .now::before{content:'';position:absolute;left:-4px;top:-4.5px;width:7px;height:7px;border-radius:50%;background:var(--now)}
.tl .blk.cx{color:var(--faint);background:var(--bad-soft);border:1px solid var(--line);border-left:3px solid var(--bad);cursor:default}
.tl .blk.cx .bn,.tl .blk.cx .bs{color:var(--faint);text-decoration:line-through}
.rstat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden}
.rstat div{padding:6px 4px;text-align:center;border-right:1px solid var(--line)} .rstat div:last-child{border-right:0}
.rstat span{display:block;font-size:10.5px;color:var(--muted)} .rstat b{font-size:15px;font-variant-numeric:tabular-nums} .rstat b.r{color:var(--bad)} .rstat b.o{color:var(--warn)}
.pl-right .chip{padding:2px 7px;font-size:11.5px}
.recent .ri.alt b{text-decoration:none}
.untimed{padding:8px 14px;border-bottom:1px solid var(--line)}
.recent .ri{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:12.5px;cursor:pointer}
.recent .ri:hover b{color:var(--accent)}
.recent .ri.fin{background:var(--soft);border-radius:6px;padding:7px 8px;margin:2px 0;color:var(--faint)}
.recent .ri.fin b{color:var(--muted);font-weight:600}
.recent .ri.fin .muted{color:var(--faint)}
.recent .ri .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.recent .ri .ago{margin-left:auto;color:var(--faint);font-size:11.5px;white-space:nowrap}
.recent .dhd{font-size:11.5px;color:var(--faint);margin:10px 0 2px}
/* 회원 = 차트 화면 */
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;background:var(--panel)}
.pbar .nm{font-size:15px;font-weight:800}
.pbar .vit{display:flex;gap:14px;color:var(--muted);flex-wrap:wrap}
.pbar .vit b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.chartlay{display:grid;grid-template-columns:290px minmax(0,1fr) 262px;flex:1;min-height:0}
.chartlay>div{min-height:0;overflow:auto}
.cl-left{border-right:1px solid var(--line)}
.cl-right{border-left:1px solid var(--line);padding:0 12px 16px}
.cl-mid{padding:12px 14px 20px;background:var(--soft)}
.hist .hi{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px}
.hist .hi:hover{background:var(--soft)}
.hist .hi.next{background:var(--accent-soft)}
.hist .hi .d{font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px}
.hist .hi .x{color:var(--muted);font-size:11.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.box>.bh{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.box>.bb{padding:10px 12px}
.sec3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.sec3>div{padding:10px 12px;border-right:1px solid var(--line);min-width:0}
.sec3>div:last-child{border-right:0}
.sec3 h3{margin:0 0 6px;font-size:12.5px;font-weight:700}
.sec3 .row{flex-wrap:wrap!important}
.sec3 .row>input{flex:1 1 100%!important;width:auto!important;order:-1}
.sec3 .row>select{flex:1;width:auto!important}
.sec3 .li{padding:5px 0;font-size:12.5px;align-items:flex-start}
.cl-right h3{font-size:12.5px;font-weight:700;margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.dtable td,.dtable th{padding:5px 8px}
.dtable td.memo{color:var(--muted);font-size:12px;max-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart .bar{fill:var(--bar)} .chart .bar.last{fill:var(--accent)}
.chart g.hov:hover .bar{fill:var(--accent)}
.chart .axis{stroke:var(--line)}
.chart .lbl{fill:var(--ink);font-weight:600;font-size:11px}
.hist .hi.open{background:var(--accent-soft)}
.hist .chev{color:var(--faint);font-size:12px}
.visit{padding:10px 12px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.visit .vh{display:flex;align-items:center;gap:6px}
.visit .vd{color:var(--accent);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.visit .vago{font-size:12px;font-weight:600}
.visit .vok{color:var(--accent);font-weight:800}
.visit .vl{display:flex;gap:6px;font-size:12px;margin:4px 0;color:var(--ink);line-height:1.45}
.visit .ic{width:14px;height:14px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.6;margin-top:2px}
.visit .vsec{display:flex;align-items:center;border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:12px;color:var(--muted);font-weight:600}
.visit .lnk{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;padding:2px 0}
.visit .vex{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:7px;padding:5px 6px;margin:1px 0;font-size:12.5px}
.visit button.vex:hover{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 1px 6px rgba(47,124,246,.18)}
.visit .vex .en{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.visit .vex .es{color:var(--muted);font-size:12px;white-space:nowrap;max-width:46%;overflow:hidden;text-overflow:ellipsis}
.visit .vex.off .en,.visit .vex.off .es{color:var(--faint);text-decoration:line-through}
.toast{border-radius:12px;padding:10px 18px;font-weight:600}
#device.port .planner{grid-template-columns:190px minmax(0,1fr)}
#device.port .pl-right{display:none}
#device.port .chartlay{grid-template-columns:200px minmax(0,1fr)}
#device.port .cl-right{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
#device.port .sec3{grid-template-columns:minmax(0,1fr)}
#device.port .sec3>div{border-right:0;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* 끝난 수업 회색, 변화 그래프, 근육 지도 (D76) */
.tl .blk.fin{color:var(--faint);background:var(--soft);border-left-color:var(--line)}
.tl .blk.fin .bn,.tl .blk.fin .bs{color:var(--muted)}
.tl .blk.fin .bd{color:var(--faint)}
.pl-key{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:11.5px;color:var(--muted)}
.pl-key i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.pl-key .k-todo{background:var(--accent-soft);border-left:3px solid var(--accent)}
.pl-key .k-fin{background:var(--soft);border-left:3px solid var(--line)}
.pl-key .k-cx{background:var(--bad-soft);border-left:3px solid var(--bad)}
:root{--mus0:#e3e7eb;--mus1:#f6d3c9;--mus2:#eda38f;--mus3:#dd6b4f;--mus4:#b8432a;--musbase:#cfd5db;--musline:#ffffff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mus0:#2c333b;--mus1:#4a2c25;--mus2:#7a3a2a;--mus3:#b5523a;--mus4:#ec7a5c;--musbase:#3a424b;--musline:#1b2026}}
:root[data-theme="dark"]{--mus0:#2c333b;--mus1:#4a2c25;--mus2:#7a3a2a;--mus3:#b5523a;--mus4:#ec7a5c;--musbase:#3a424b;--musline:#1b2026}
.musmap{display:block;margin:2px auto 4px}
.musmap polygon{stroke:var(--musline);stroke-width:.35;stroke-linejoin:round}
.musmap polygon.mu:hover{stroke:var(--ink);stroke-width:.8}
.musmap .ml{font-size:10px;fill:var(--faint)}
.muslegend{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin:2px 0 4px}
.muslegend i{width:16px;height:8px;border-radius:2px;display:inline-block}
.muslegend .sp{flex:1}
.mustop{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:12px;margin-bottom:4px}
.mustop b{font-weight:700}
.dsum{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:6px}
.dsum .up b{color:var(--good)} .dsum .dn b{color:var(--bad)}
.dchart .dl{display:grid;grid-template-columns:minmax(0,118px) 120px 44px minmax(0,1fr);gap:8px;align-items:center;font-size:12.5px;padding:3px 0;border-bottom:1px solid var(--soft)}
.dchart .dn-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.dchart .dbar{position:relative;height:12px;background:linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat}
.dchart .dbar i{position:absolute;top:2px;height:8px;border-radius:2px}
.dchart .dbar i.up{background:var(--good)} .dchart .dbar i.dn{background:var(--bad)}
.dchart .deq{position:absolute;left:calc(50% - 3px);top:3px;width:6px;height:6px;border-radius:50%;background:var(--faint)}
.dchart .dfirst{position:absolute;left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--faint);top:-1px}
.dchart .dv{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.dchart .dv.up{color:var(--good)} .dchart .dv.dn{color:var(--bad)} .dchart .dv.eq{color:var(--faint)}
.dchart .dlab{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumviz{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:14px;align-items:start}
.sumviz .dchart .dl{grid-template-columns:minmax(0,1fr) 80px 44px;row-gap:0}
.sumviz .dchart .dlab{grid-column:1/-1;font-size:11.5px}
.untimed .srow.fin{background:var(--soft);color:var(--faint);border-left:3px solid var(--line);padding-left:8px}
.untimed .srow.fin b{color:var(--muted)}
.untimed .srow.todo{border-left:3px solid var(--accent);padding-left:8px;background:var(--accent-soft)}

/* 스톱워치: 왼쪽 시계·버튼 | 오른쪽 랩 */
.sw{display:flex;border-top:1px solid var(--line);background:var(--panel);height:178px;flex:none}
.sw-l{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;border-right:1px solid var(--line)}
.sw-lbl{position:absolute;left:16px;top:10px;font-size:12px;color:var(--muted);font-weight:600}
.sw-time{font-size:50px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.5px;line-height:1}
.sw-btns{display:flex;justify-content:space-between;width:300px}
.swb{width:64px;height:64px;border-radius:50%;border:0;font:inherit;font-size:15px;font-weight:500;cursor:pointer;--ring:var(--line);box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--ring)}
.swb.lap{background:var(--soft);color:var(--ink)}
.swb.lap:disabled{color:var(--faint);cursor:default}
.swb.go{background:var(--good-soft);color:var(--good);--ring:var(--good-soft)}
.swb.stop{background:var(--bad-soft);color:var(--bad);--ring:var(--bad-soft)}
.sw-r{flex:1;display:flex;flex-direction:column;min-width:0;padding:10px 16px 8px}
.sw-rh{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);padding-bottom:4px;border-bottom:1px solid var(--line)}
.sw-laps{flex:1;overflow:auto}
.swl{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.swl.fast{color:var(--good)} .swl.slow{color:var(--bad)}
.swl.empty{color:var(--muted);font-size:13px;border-bottom:0}

/* ===== 테마 v3 (2026-11-06, 인투씨엔에스 클라우드 EMR 느낌: 회색 바탕 위 흰 패널 여러 개, 머리줄 있는 패널, 촘촘한 표, 위쪽 메뉴, 진한 파랑) ===== */
:root{
  --bg:#dfe4eb; --device:#eef1f5; --panel:#ffffff; --ink:#1b2130; --muted:#5f6b7c; --faint:#97a1ae;
  --line:#dce1e8; --line2:#cdd4de; --soft:#f4f6f9; --hd:#f3f5f8; --phd:#fafbfc; --accent:#1f66f2; --accent-soft:#e8f0ff; --accent-ink:#ffffff;
  --side:#ffffff; --zebra:#fafbfd; --bar:#a9c4f7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--device:#101318; --line2:#323843; --phd:#1b1f26; --accent:#5c95ff}}
:root[data-theme="dark"]{--device:#101318; --line2:#323843; --phd:#1b1f26; --accent:#5c95ff}
#device{font-size:13px;border-radius:12px;background:var(--device)}
/* 위쪽 메뉴 (왼쪽 메뉴를 위로) */
#app:has(> .sidenav){padding-left:0;padding-top:44px}
.tabbar.sidenav{left:0;right:0;top:0;bottom:auto;width:auto;height:44px;flex-direction:row;align-items:stretch;border-right:0;border-bottom:1px solid var(--line2);padding:0 10px;gap:2px;background:var(--panel)}
.sidenav .logo{margin:auto 14px auto 4px;width:auto;height:auto;border:0;border-radius:0;font-size:14px;font-weight:800;letter-spacing:-.02em;color:var(--ink);gap:6px}
.sidenav .logo::before{content:'';width:9px;height:18px;border-radius:5px;background:linear-gradient(var(--accent),#7a5cff)}
.sidenav .logo::after{content:'PT 기록';margin-left:0}
.tabbar.sidenav button{flex-direction:row;gap:6px;padding:0 14px;border-radius:0;font-size:13px;color:var(--muted)}
.tabbar.sidenav button svg{width:16px;height:16px}
.tabbar.sidenav button:hover{background:var(--soft)}
